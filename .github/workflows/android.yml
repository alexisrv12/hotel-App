name: Build Hotel Rivera APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Firebase Configuration
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing!"
            exit 1
          fi
          echo "Firebase google-services.json verified."

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotel-rivera-apk
          path: app/build/outputs/apk/debug/*.apk
          
